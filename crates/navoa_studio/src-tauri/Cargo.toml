[package]
name = "navoa_studio"
version = "0.1.0"
description = "Navoa Studio IDE"
edition = "2021"

[lib]
name = "navoa_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crates internos do Navoa
navoa_lexer = { path = "../../navoa_lexer" }
navoa_parser = { path = "../../navoa_parser" }
navoa_vm = { path = "../../navoa_vm" }
navoa_codegen = { path = "../../navoa_codegen" }
