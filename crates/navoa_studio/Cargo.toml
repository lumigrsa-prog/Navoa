[package]
name = "navoa_studio"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
navoa_lexer = { path = "../navoa_lexer" }
navoa_parser = { path = "../navoa_parser" }
navoa_vm = { path = "../navoa_vm" }

[build-dependencies]
tauri-build = { version = "2", features = [] }
