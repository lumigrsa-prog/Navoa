<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Navoa Studio IDE</title>
  <style>
    body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 20px; }
    textarea { width: 100%; height: 150px; background: #252526; color: #9cdcfe; border: 1px solid #3c3c3c; padding: 10px; font-family: monospace; }
    button { background: #0e639c; color: white; border: none; padding: 10px 20px; cursor: pointer; margin-top: 10px; }
    button:hover { background: #1177bb; }
    pre { background: #252526; padding: 10px; border: 1px solid #3c3c3c; min-height: 50px; }
  </style>
</head>
<body>
  <h2>Navoa Studio IDE</h2>
  <label for="codigo">Código Navoa:</label>
  <textarea id="codigo">var x = 10;
var y = 20;
imprimir(x + y);</textarea>
  <br>
  <button onclick="executar()">Executar Código</button>

  <h3>Saída da VM:</h3>
  <pre id="saida-vm">A aguardar execução...</pre>

  <h3>JavaScript Transpilado (Codegen):</h3>
  <pre id="saida-js">A aguardar transpilação...</pre>

  <script>
    const { invoke } = window.__TAURI__.core;

    async function executar() {
      const codigo = document.getElementById('codigo').value;
      try {
        const res = await invoke('executar_navoa', { codigo: codigo });
        document.getElementById('saida-vm').innerText = res.saida || "(sem saída de texto)";
        document.getElementById('saida-js').innerText = res.js_transpilado;
      } catch (err) {
        document.getElementById('saida-vm').innerText = "Erro: " + err;
      }
    }
  </script>
</body>
</html>
