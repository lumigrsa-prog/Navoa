<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Navoa Studio IDE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 15px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1e1e1e; color: #d4d4d4;
      display: flex; flex-direction: column; height: 100vh;
    }
    .container { display: flex; flex: 1; gap: 15px; margin-top: 10px; }
    .editor-section { flex: 1; display: flex; flex-direction: column; }
    .output-section { flex: 1; display: flex; flex-direction: column; gap: 10px; }
    #editor { flex: 1; border: 1px solid #3c3c3c; border-radius: 4px; min-height: 300px; }
    button {
      background: #0e639c; color: white; border: none; padding: 10px 18px;
      cursor: pointer; font-weight: bold; border-radius: 4px; align-self: flex-start;
    }
    button:hover { background: #1177bb; }
    pre {
      background: #252526; padding: 10px; border: 1px solid #3c3c3c;
      border-radius: 4px; flex: 1; overflow: auto; font-family: monospace; margin: 0;
    }
    h3 { margin: 5px 0; color: #569cd6; font-size: 14px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
</head>
<body>

  <h2>Navoa Studio IDE</h2>
  <button onclick="executar()">▶ Executar Código</button>

  <div class="container">
    <div class="editor-section">
      <h3>Editor de Código (Navoa)</h3>
      <div id="editor"></div>
    </div>

    <div class="output-section">
      <h3>Saída da VM:</h3>
      <pre id="saida-vm">A aguardar execução...</pre>

      <h3>JavaScript Transpilado:</h3>
      <pre id="saida-js">A aguardar transpilação...</pre>
    </div>
  </div>

  <script>
    let editor;

    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});

    require(['vs/editor/editor.main'], function() {
      monaco.languages.register({ id: 'navoa' });

      monaco.languages.setMonarchTokensProvider('navoa', {
        keywords: [
          'var', 'se', 'senao', 'senãose', 'se_nao', 'enquanto', 'para', 'funcao', 'imprimir', 'retornar',
          'if', 'else', 'elif', 'while', 'for', 'func', 'print', 'return',
          'mientras', 'imprimir_esp'
        ],
        typeKeywords: ['true', 'false', 'verdadeiro', 'falso', 'nulo', 'null'],
        operators: ['=', '>', '<', '!', '==', '<=', '>=', '!=', '+', '-', '*', '/', '%'],

        tokenizer: {
          root: [
            [/[a-zA-Z_À-ÿ][a-zA-Z0-9_À-ÿ]*/, {
              cases: {
                '@keywords': 'keyword',
                '@typeKeywords': 'type.identifier',
                '@default': 'identifier'
              }
            }],
            { include: '@whitespace' },
            [/\d*\.\d+([eE][\-+]?\d+)?/, 'number.float'],
            [/\d+/, 'number'],
            [/"([^"\\]|\\.)*"/, 'string'],
            [/'([^'\\]|\\.)*'/, 'string'],
            [/[{}()\[\]]/, '@brackets'],
            [/[=><!~?:&|+\-*\/\^%]+/, 'operator'],
          ],
          whitespace: [
            [/[ \t\r\n]+/, 'white'],
            [/\/\*/, 'comment', '@comment'],
            [/\/\/.*$/, 'comment'],
          ],
          comment: [
            [/[^\/*]+/, 'comment'],
            [/\*\//, 'comment', '@pop'],
            [/[\/*]/, 'comment']
          ],
        }
      });

      // --- CONFIGURAÇÃO DO AUTOCOMPLETAR (INTELLISENSE) ---
      monaco.languages.registerCompletionItemProvider('navoa', {
        provideCompletionItems: function(model, position) {
          const suggestions = [
            // Palavras-chave básicas
            { label: 'imprimir', kind: monaco.languages.CompletionItemKind.Keyword, insertText: 'imprimir(${1:valor});', insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet },
            { label: 'print', kind: monaco.languages.CompletionItemKind.Keyword, insertText: 'print(${1:valor});', insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet },
            { label: 'var', kind: monaco.languages.CompletionItemKind.Keyword, insertText: 'var ${1:nome} =${2:valor};', insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet },
            
            // Snippets para Estruturas de Controlo
            {
              label: 'se (condicao)',
              kind: monaco.languages.CompletionItemKind.Snippet,
              insertText: 'se (${1:condicao}) {\n\t$0\n}',
              insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
              documentation: 'Bloco condicional Se'
            },
            {
              label: 'enquanto (condicao)',
              kind: monaco.languages.CompletionItemKind.Snippet,
              insertText: 'enquanto (${1:condicao}) {\n\t$0\n}',
              insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
              documentation: 'Ciclo de repetição Enquanto'
            },
            {
              label: 'funcao',
              kind: monaco.languages.CompletionItemKind.Snippet,
              insertText: 'funcao ${1:nome}(${2:params}) {\n\t$0\n}',
              insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
              documentation: 'Declaração de função'
            },

            // Suporte a Listas/Arrays
            {
              label: 'lista [array]',
              kind: monaco.languages.CompletionItemKind.Snippet,
              insertText: 'var ${1:lista} = [${2:1, 2, 3}];',
              insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
              documentation: 'Criação de uma nova Lista'
            }
          ];
          return { suggestions: suggestions };
        }
      });

      monaco.editor.defineTheme('navoa-theme', {
        base: 'vs-dark',
        inherit: true,
        rules: [
          { token: 'keyword', foreground: 'C586C0', fontStyle: 'bold' },
          { token: 'string', foreground: 'CE9178' },
          { token: 'number', foreground: 'B5CEA8' },
          { token: 'comment', foreground: '6A9955', fontStyle: 'italic' },
          { token: 'type.identifier', foreground: '569CD6' }
        ],
        colors: { 'editor.background': '#1e1e1e' }
      });

      editor = monaco.editor.create(document.getElementById('editor'), {
        value: `// Exemplo de Listas no Navoa
var numeros = [10, 20, 30];
var nomes = ["Lisboa", "Porto"];

imprimir(numeros[0]);
imprimir(nomes[1]);`,
        language: 'navoa',
        theme: 'navoa-theme',
        automaticLayout: true,
        fontSize: 14,
        minimap: { enabled: false }
      });
    });

    async function executar() {
      if (!editor) return;
      const codigo = editor.getValue();
      const { invoke } = window.__TAURI__.core;

      try {
        const res = await invoke('executar_navoa', { codigo: codigo });
        document.getElementById('saida-vm').innerText = res.saida || "(sem saída de texto)";
        document.getElementById('saida-js').innerText = res.js_transpilado;
      } catch (err) {
        document.getElementById('saida-vm').innerText = "Erro: " + err;
      }
    }
  </script>
</body>
</html>
