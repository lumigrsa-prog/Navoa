name: Build Navoa Multiplatform App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Gerar estrutura nativa Android
        run: flutter create . --org com.navoa --project-name navoa --overwrite

      - name: Instalar ferramentas Rust (cargo-binstall, frb, cargo-ndk)
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          ~/.cargo/bin/cargo-binstall flutter_rust_bridge_codegen@^2.0.0 -y
          ~/.cargo/bin/cargo-binstall cargo-ndk -y

      - name: Gerar Bindings do Rust para Flutter
        run: ~/.cargo/bin/flutter_rust_bridge_codegen generate

      - name: Compilar bibliotecas Rust (.so) para Android
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          mkdir -p android/app/src/main/jniLibs
          ~/.cargo/bin/cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o android/app/src/main/jniLibs build --release --manifest-path rust/Cargo.toml

      - name: Instalar dependências do Flutter
        run: flutter pub get

      - name: Compilar APK Android
        run: flutter build apk --release

      - name: Guardar APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Navoa-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
