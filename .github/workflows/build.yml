name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Recriar pasta Android
        run: |
          rm -rf android
          flutter create --project-name navoa .

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Publicar Release com APK direto
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          tag: "v1.0.${{ github.run_number }}"
          name: "Navoa Build #${{ github.run_number }}"
          body: "Instalador APK direto gerado automaticamente."
          token: ${{ secrets.GITHUB_TOKEN }}
