name: Build Navoa Studio APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Instalar Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Inicializar e Compilar APK (Android)
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          cd crates/navoa_studio
          cargo tauri android init || true
          cargo tauri android build --apk

      - name: Guardar ficheiro APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: NavoaStudio-APK
          path: crates/navoa_studio/gen/android/app/build/outputs/apk/**/*.apk
